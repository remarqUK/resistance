<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Chart</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="/static/chart_core.js"></script>
  <style>
    body { margin: 0; background: var(--bg-page); }
    .chart-shell { display: flex; flex-direction: column; height: 100vh; }
    .chart-header {
      display: flex; align-items: center; gap: 16px;
      padding: 12px 20px; background: var(--bg-card);
      border-bottom: 1px solid var(--border);
    }
    .chart-header h1 { font-size: 1.3rem; margin: 0; }
    .chart-header .pair-name { color: var(--accent); }
    .chart-header .live-price { font-family: "Aptos", monospace; font-size: 1.1rem; }
    .chart-header .back-link { color: var(--fg-soft); text-decoration: none; font-size: 0.9rem; }
    .chart-header .back-link:hover { color: var(--accent); }
    .chart-header .zone-info { font-size: 0.85rem; color: var(--fg-soft); }
    .chart-header .zone-info .zone-label { font-weight: 600; }
    .chart-container { flex: 1; }
  </style>
</head>
<body>
  <div class="chart-shell">
    <div class="chart-header">
      <a href="/" class="back-link">Back</a>
      <h1><span class="pair-name" id="pair-name">--</span></h1>
      <span class="live-price" id="live-price">--</span>
      <span id="connection-pill" class="pill pill-muted">Connecting</span>
      <span class="zone-info" id="zone-info"></span>
    </div>
    <div class="chart-container" id="chart-container"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const signalId = params.get('signal_id') || '';
    function parseFirstParam(names) {
      for (const name of names) {
        const value = params.get(name);
        if (value !== null && value !== '') return value;
      }
      return null;
    }
    function normalizeDecimal(value) {
      const parsed = parseFloat(value);
      return Number.isFinite(parsed) ? parsed : null;
    }
    function parseFloatParam(names) {
      const raw = parseFirstParam(names);
      return raw === null || raw === '' ? null : normalizeDecimal(raw);
    }
    let pair = parseFirstParam(['pair']) || '';
    let direction = parseFirstParam(['direction', 'dir']) || null;
    let entryPrice = parseFloatParam(['entry_price', 'entryPrice', 'entry', 'opened_price']);
    let entryTime = parseFirstParam(['entry_time', 'entryTime', 'opened_at', 'signal_time']);
    let exitPrice = parseFloatParam(['exit_price', 'exitPrice', 'closed_price']);
    let exitTime = parseFirstParam(['exit_time', 'exitTime', 'closed_at']);
    let sl = parseFloatParam(['sl', 'sl_price', 'stop_loss', 'stop']);
    let tp = parseFloatParam(['tp', 'tp_price', 'take_profit']);

    function updatePairHeader() {
      if (pair) {
        document.getElementById('pair-name').textContent = pair;
        document.title = `IBKR - ${pair} - Live Chart`;
      } else {
        document.getElementById('pair-name').textContent = 'No pair specified';
        document.title = 'IBKR - Live Chart';
      }
    }

    updatePairHeader();

    let chart = null;
    let candleSeries = null;
    const CHART_DECIMALS = 5;
    let decimals = CHART_DECIMALS;

    function initChart() {
      const container = document.getElementById('chart-container');
      const chartState = window.fxChartCore.createStandardChart(container, {
        decimals: CHART_DECIMALS,
      });
      chart = chartState.chart;
      candleSeries = chartState.candleSeries;

      chart.timeScale().subscribeVisibleLogicalRangeChange(onVisibleRangeChange);

      new ResizeObserver(() => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      }).observe(container);
    }

    function addZoneSummary(support, resistance) {
      const zoneInfo = document.getElementById('zone-info');
      if (!zoneInfo) return;
      zoneInfo.textContent = '';
      const parts = [];
      if (support) {
        parts.push(`<span class="zone-label" style="color:#1f7a49">S:</span> ${support.lower.toFixed(decimals)}-${support.upper.toFixed(decimals)}`);
      }
      if (resistance) {
        parts.push(`<span class="zone-label" style="color:#b23b29">R:</span> ${resistance.lower.toFixed(decimals)}-${resistance.upper.toFixed(decimals)}`);
      }
      zoneInfo.innerHTML = parts.join(' ');
    }

    function addZoneBands(support, resistance, bars) {
      window.fxChartCore.addZoneBands(chart, support, resistance, bars);
    }

    async function loadChartData() {
      if (!pair) return;
      try {
        const resp = await fetch(`/api/chart-data?pair=${encodeURIComponent(pair)}`);
        const data = await resp.json();
        if (data.error) return;

        decimals = CHART_DECIMALS;
      if (data.bars && data.bars.length) {
          loadedBars = data.bars;
          candleSeries.setData(data.bars);
          streamEarliest = data.bars[0].time;
          streamLatest = data.bars[data.bars.length - 1].time;
          const last = data.bars[data.bars.length - 1];
          document.getElementById('live-price').textContent = last.close.toFixed(decimals);
        }
        addZoneSummary(data.support, data.resistance);
        addZoneBands(data.support, data.resistance, data.bars);
        window.fxChartCore.addZoneLines(candleSeries, data.support, data.resistance, decimals);
      } catch (e) {
        console.error('Failed to load chart data:', e);
      }
    }

    // WebSocket for live price updates
    function connectWs() {
      if (wsPriceTicker) {
        clearInterval(wsPriceTicker);
      }
      const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(`${protocol}://${window.location.host}/ws`);
      const pill = document.getElementById('connection-pill');
      wsPricePending = null;

      wsPriceTicker = window.setInterval(() => {
        if (wsPricePending == null) {
          return;
        }
        const price = wsPricePending;
        wsPricePending = null;
        updateLivePrice(price);
      }, chartPriceUpdateIntervalMs);

      ws.addEventListener('open', () => {
        pill.className = 'pill pill-live';
        pill.textContent = 'Live';
      });

      ws.addEventListener('message', (event) => {
        const msg = JSON.parse(event.data);

        // Handle pair_update for our pair
        if (msg.type === 'pair_update' && msg.row && msg.row.pair === pair) {
          if (msg.row.price != null) {
            wsPricePending = msg.row.price;
          }
        }

        // Handle full snapshot — find our pair
        if ((msg.type === 'bootstrap' || msg.type === 'snapshot') && msg.state && msg.state.pairs) {
          const row = msg.state.pairs[pair];
          if (row && row.price != null) {
            wsPricePending = row.price;
          }
        }
      });

      ws.addEventListener('close', () => {
        pill.className = 'pill pill-muted';
        pill.textContent = 'Disconnected';
        if (wsPriceTicker) {
          clearInterval(wsPriceTicker);
          wsPriceTicker = null;
        }
        setTimeout(connectWs, 1500);
      });

      ws.addEventListener('error', () => ws.close());
    }

    let wsPricePending = null;
    let wsPriceTicker = null;
    let lastBarTime = null;
    let currentBar = null;
    let loadedBars = [];
    const chartPriceUpdateIntervalMs = 30000;

    // Scroll-streaming state
    let streamedBars = [];
    let streamEarliest = null;   // unix timestamp (seconds)
    let streamLatest = null;     // unix timestamp (seconds)
    let streamLoading = false;
    let _streamTimer = null;

    function onVisibleRangeChange(logicalRange) {
      if (!logicalRange || streamLoading) return;
      if (_streamTimer) clearTimeout(_streamTimer);
      _streamTimer = setTimeout(() => {
        // Preload when visible edge is within 24h of loaded data boundary
        const vr = chart.timeScale().getVisibleRange();
        if (!vr) return;
        const buffer = 24 * 3600; // 24h in seconds
        if (streamEarliest != null && vr.from - buffer < streamEarliest) {
          streamBars('backward');
        }
        if (streamLatest != null && vr.to + buffer > streamLatest) {
          streamBars('forward');
        }
      }, 150);
    }

    async function streamBars(direction) {
      if (streamLoading || !pair) return;
      streamLoading = true;
      try {
        const daysToLoad = 7;
        let start, end;
        if (direction === 'backward') {
          end = new Date((streamEarliest - 1) * 1000);
          start = new Date(end.getTime() - daysToLoad * 86400000);
        } else {
          start = new Date((streamLatest + 1) * 1000);
          end = new Date(start.getTime() + daysToLoad * 86400000);
          if (start > new Date(Date.now() + 86400000)) return;
        }
        const params = new URLSearchParams({
          pair, tf: '1h',
          start: start.toISOString(),
          end: end.toISOString(),
        });
        const res = await fetch(`/api/replay/bars?${params}`);
        if (!res.ok) return;
        const data = await res.json();
        const newBars = data.bars || [];
        if (!newBars.length) {
          if (direction === 'backward') streamEarliest = null;
          else streamLatest = null;
          return;
        }
        // Convert ISO to unix timestamps and deduplicate
        const existingTimes = new Set(loadedBars.map(b => b.time));
        for (const b of streamedBars) existingTimes.add(b.time);

        const converted = [];
        for (const b of newBars) {
          const t = Math.floor(new Date(b.time).getTime() / 1000);
          if (existingTimes.has(t)) continue;
          existingTimes.add(t);
          converted.push({ time: t, open: b.open, high: b.high, low: b.low, close: b.close });
        }
        if (!converted.length) {
          if (direction === 'backward') streamEarliest = null;
          else streamLatest = null;
          return;
        }
        streamedBars = streamedBars.concat(converted);
        streamedBars.sort((a, b) => a.time - b.time);
        rebuildChart();
      } catch (e) {
        console.warn('Stream bars error:', e);
      } finally {
        streamLoading = false;
      }
    }

    function rebuildChart() {
      // Merge streamed + loaded, sort, deduplicate
      const merged = new Map();
      for (const b of streamedBars) merged.set(b.time, b);
      for (const b of loadedBars) merged.set(b.time, b);
      const all = [...merged.values()].sort((a, b) => a.time - b.time);
      candleSeries.setData(all);
      // Update bounds
      if (all.length) {
        streamEarliest = all[0].time;
        streamLatest = all[all.length - 1].time;
      }
    }

    function updateLivePrice(price) {
      if (price == null || price <= 0) return;
      document.getElementById('live-price').textContent = price.toFixed(decimals);

      if (!candleSeries) return;

      const now = Math.floor(Date.now() / 1000);
      const hourStart = now - (now % 3600);

      if (currentBar && lastBarTime === hourStart) {
        // Update existing bar
        currentBar.high = Math.max(currentBar.high, price);
        currentBar.low = Math.min(currentBar.low, price);
        currentBar.close = price;
        candleSeries.update({
          time: hourStart,
          open: currentBar.open,
          high: currentBar.high,
          low: currentBar.low,
          close: currentBar.close,
        });
      } else {
        // New hour — start fresh bar
        lastBarTime = hourStart;
        currentBar = { open: price, high: price, low: price, close: price };
        candleSeries.update({
          time: hourStart,
          open: price,
          high: price,
          low: price,
          close: price,
        });
      }
    }

    function loadTradeFromSignalId() {
      if (!signalId && !pair) {
        return Promise.resolve();
      }

      const endpoint = signalId
        ? `/api/live-trade?signal_id=${encodeURIComponent(signalId)}`
        : `/api/live-trade?pair=${encodeURIComponent(pair)}${direction ? '&direction=' + encodeURIComponent(direction.toUpperCase()) : ''}`;

      return fetch(endpoint)
        .then((response) => {
          if (!response.ok) {
            return null;
          }
          return response.json();
        })
        .then((payload) => {
          if (!payload || !payload.trade) {
            return;
          }

          const trade = payload.trade;
          if (trade.pair) {
            pair = String(trade.pair).toUpperCase();
          }
          if (trade.direction) {
            direction = String(trade.direction).toUpperCase();
          }
          entryPrice = normalizeDecimal(trade.opened_price);
          if (entryPrice == null) {
            entryPrice = normalizeDecimal(trade.entry_price);
          }
          if (entryPrice == null) {
            entryPrice = normalizeDecimal(trade.submitted_entry_price);
          }
          entryTime = trade.opened_at || trade.signal_time || null;
          exitPrice = normalizeDecimal(trade.closed_price);
          exitTime = trade.closed_at || null;
          sl = normalizeDecimal(trade.submitted_sl_price);
          if (sl == null) {
            sl = normalizeDecimal(trade.sl_price);
          }
          tp = normalizeDecimal(trade.submitted_tp_price);
          if (tp == null) {
            tp = normalizeDecimal(trade.tp_price);
          }
          updatePairHeader();
        });
    }

    function addTradeOverlay() {
      if (!entryPrice || !candleSeries) return;
      const dir = (direction || '').toUpperCase();
      const isLong = dir === 'LONG';

      // Entry marker
      const markers = [];
      if (entryTime) {
        const entryTs = Math.floor(new Date(entryTime).getTime() / 1000);
        markers.push({
          time: entryTs,
          position: isLong ? 'belowBar' : 'aboveBar',
          color: isLong ? '#1f7a49' : '#b23b29',
          shape: isLong ? 'arrowUp' : 'arrowDown',
          text: `${dir} @ ${entryPrice.toFixed(decimals)}`,
        });
      }

      // Exit marker
      if (exitTime && exitPrice) {
        const exitTs = Math.floor(new Date(exitTime).getTime() / 1000);
        markers.push({
          time: exitTs,
          position: isLong ? 'aboveBar' : 'belowBar',
          color: '#d4a017',
          shape: 'circle',
          text: `Exit @ ${exitPrice.toFixed(decimals)}`,
        });
      }

      if (markers.length) {
        markers.sort((a, b) => a.time - b.time);
        candleSeries.setMarkers(markers);
      }

      // SL / TP price lines
      if (sl) {
        candleSeries.createPriceLine({
          price: sl,
          color: '#b23b29',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          axisLabelVisible: true,
          title: 'SL',
        });
      }
      if (tp) {
        candleSeries.createPriceLine({
          price: tp,
          color: '#1f7a49',
          lineWidth: 1,
          lineStyle: LightweightCharts.LineStyle.Dotted,
          axisLabelVisible: true,
          title: 'TP',
        });
      }
      // Entry price line
      candleSeries.createPriceLine({
        price: entryPrice,
        color: '#d4a017',
        lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Solid,
        axisLabelVisible: true,
        title: 'Entry',
      });

      // Update header with trade info
      const pnlText = exitPrice
        ? (() => {
            const dist = isLong
              ? exitPrice - entryPrice
              : entryPrice - exitPrice;
            const risk = Math.abs(entryPrice - (sl || entryPrice));
            const r = risk > 0 ? (dist / risk).toFixed(2) : '?';
            return ` | ${dist > 0 ? '+' : ''}${r}R`;
          })()
        : '';
      document.getElementById('zone-info').innerHTML +=
        ` <span style="color:#d4a017;font-weight:600">${dir} @ ${entryPrice.toFixed(decimals)}${pnlText}</span>`;

      // Scroll chart to entry time
      if (entryTime) {
        const entryTs = Math.floor(new Date(entryTime).getTime() / 1000);
        const padding = 12 * 3600;
        chart.timeScale().setVisibleRange({
          from: entryTs - padding,
          to: entryTs + padding,
        });
      }
    }

    // Init
    (signalId || pair ? loadTradeFromSignalId() : Promise.resolve())
      .then(function () {
        initChart();
        return loadChartData();
      })
      .then(function () {
        // Seed currentBar from the last loaded bar (the in-progress bar from accumulator)
        if (loadedBars.length > 0) {
          const last = loadedBars[loadedBars.length - 1];
          lastBarTime = last.time;
          currentBar = { open: last.open, high: last.high, low: last.low, close: last.close };
        }
        addTradeOverlay();
      });
    connectWs();
  </script>
</body>
</html>
