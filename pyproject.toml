[project]
name = "resistance"
version = "0.1.0"
description = "FX support/resistance trading system"
requires-python = ">=3.10"

[project.scripts]
trade = "run:main"

[tool.setuptools]
py-modules = ["run"]
packages = ["fx_sr"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
